<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin clients - Verdure & Cie</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="simple-page simple-page--admin">
    <section class="container admin-shell">
      <div class="section__head">
        <p class="eyebrow">Administration</p>
        <h1>Espace clients</h1>
        <p class="lead">Crée un dossier client, puis transmets le lien privé au voyageur. Le lien permet de signer les documents, payer l’acompte Stripe et déposer la caution via Swikly.</p>
      </div>

      <form class="form" id="adminClientForm">
        <label><span>Token admin</span><input type="password" name="adminToken" autocomplete="off" required></label>
        <div class="form__row">
          <label><span>Nom client</span><input type="text" name="guestName" required></label>
          <label><span>Email client</span><input type="email" name="guestEmail" required></label>
        </div>
        <label><span>Téléphone</span><input type="tel" name="guestPhone"></label>
        <div class="form__row">
          <label><span>Arrivée</span><input type="date" name="arrival"></label>
          <label><span>Départ</span><input type="date" name="departure"></label>
        </div>
        <div class="form__row">
          <label><span>Voyageurs</span><input type="number" min="1" max="10" name="guests" value="2"></label>
          <label><span>Montant total séjour (€)</span><input type="number" min="0" step="0.01" name="totalAmount" placeholder="Ex : 1200"></label>
        </div>
        <label><span>Lien Swikly caution</span><input type="url" name="swiklyUrl" placeholder="https://..."></label>
        <label><span>Notes internes</span><textarea name="notes" placeholder="Contrat, précisions, demande spéciale..."></textarea></label>
        <button class="btn btn--primary btn--full" type="submit">Créer le dossier client</button>
        <p class="form__error" id="adminError" hidden></p>
      </form>

      <div class="result-card" id="adminResult" hidden></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
